<script type="module">


/* ==========================================================
   SPLASH ZERO-G WRAPPER

   ORIGINAL SOURCE:

   https://github.com/matsuoka-601/Splash

   THIS FILE LOADS THE ORIGINAL:

       camera.ts

       mls-mpm/mls-mpm.ts

       mls-mpm/*.wgsl

       render/fluidRender.ts

       render/*.wgsl

       main.ts

   FROM THE REPOSITORY.

   MODIFICATIONS:

   1. Initial particle distribution -> centered water blob.

   2. Uniform Earth gravity:
          vec3(0,-g,0)

      becomes an isotropic center-directed field:

          a = K * (CENTER - POSITION)

   3. Touch coordinates are forwarded into Splash's original
      mouse-fluid interaction.

   IMPORTANT:

   THERE IS NO:

       target sphere radius
       sphere collider
       spherical mesh
       lerp-to-sphere
       position projection onto a sphere
       animated sphere deformation

   ========================================================== */


const REPO =

    "https://raw.githubusercontent.com/matsuoka-601/Splash/main";


const TS =
    window.ts;


const canvas =
    document.getElementById(
        "fluidCanvas"
    );


const loading =
    document.getElementById(
        "loading"
    );


const status =
    document.getElementById(
        "status"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const hint =
    document.getElementById(
        "hint"
    );



/* ==========================================================
   ERROR HANDLING
   ========================================================== */

function fatal(error) {

    console.error(
        error
    );


    errorBox.style.display =
        "block";


    errorBox.textContent =

        String(

            error?.stack ||
            error?.message ||
            error

        );


    status.innerHTML =

        "<b>Failed to start WebGPU Splash.</b><br><br>" +

        String(

            error?.message ||
            error

        );

}


window.addEventListener(

    "unhandledrejection",

    event => {

        fatal(
            event.reason
        );

    }

);


window.addEventListener(

    "error",

    event => {

        if (
            event.error
        ) {

            fatal(
                event.error
            );

        }

    }

);



/* ==========================================================
   WEBGPU CHECK
   ========================================================== */

if (!navigator.gpu) {

    throw new Error(

        "WebGPU is unavailable. " +

        "Use current Chrome/Edge on Android or another " +

        "WebGPU-capable browser and serve this page over HTTPS."

    );

}



/* ==========================================================
   FETCH ORIGINAL REPOSITORY FILE
   ========================================================== */

async function getText(path) {

    status.textContent =

        "Loading " +
        path +
        "…";


    const url =

        REPO +
        "/" +
        path;


    const response =

        await fetch(

            url,

            {
                cache:
                    "no-store"
            }

        );


    if (!response.ok) {

        throw new Error(

            "Could not load " +
            path +
            " — HTTP " +
            response.status

        );

    }


    return await response.text();

}



/* ==========================================================
   PATH UTILITIES
   ========================================================== */

function dirname(path) {

    const index =

        path.lastIndexOf("/");


    if (
        index === -1
    ) {

        return "";

    }


    return path.substring(

        0,

        index + 1

    );

}



function normalizePath(path) {

    const output =
        [];


    const pieces =

        path.split("/");


    for (
        const piece of pieces
    ) {

        if (
            !piece ||
            piece === "."
        ) {

            continue;

        }


        if (
            piece === ".."
        ) {

            output.pop();

        }

        else {

            output.push(
                piece
            );

        }

    }


    return output.join("/");

}



function resolvePath(

    parent,
    relative

) {

    return normalizePath(

        dirname(
            parent
        ) +

        relative

    );

}



/* ==========================================================
   EXTERNAL PACKAGE IMPORTS
   ========================================================== */

function rewritePackages(source) {

    source =

        source.replace(

            /from\s+['"]wgpu-matrix['"]/g,

            `from "https://cdn.jsdelivr.net/npm/wgpu-matrix@3.3.0/+esm"`

        );


    source =

        source.replace(

            /from\s+['"]lil-gui['"]/g,

            `from "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/+esm"`

        );


    return source;

}



/* ==========================================================
   TYPESCRIPT -> JAVASCRIPT
   ========================================================== */

function compile(

    source,
    filename

) {

    const result =

        TS.transpileModule(

            source,

            {

                fileName:
                    filename,

                compilerOptions: {

                    target:
                        TS.ScriptTarget.ES2022,

                    module:
                        TS.ModuleKind.ES2022,

                    moduleResolution:
                        TS.ModuleResolutionKind.Bundler,

                    useDefineForClassFields:
                        false,

                    strict:
                        false

                }

            }

        );


    if (

        result.diagnostics &&
        result.diagnostics.length

    ) {

        console.warn(

            "TypeScript diagnostics for " +
            filename,

            result.diagnostics

        );

    }


    return result.outputText;

}



/* ==========================================================
   CREATE BLOB MODULE
   ========================================================== */

function moduleURL(source) {

    return URL.createObjectURL(

        new Blob(

            [
                source
            ],

            {
                type:
                    "text/javascript"
            }

        )

    );

}



/* ==========================================================
   CENTRAL GRAVITY PATCH

   THIS PATCH NOW TARGETS ONLY THIS CURRENT SPLASH EXPRESSION:

       floatV.y + strength*forceDir.y - 0.40*dt

   rather than attempting to match the entire shader block.

   The current repository has this at updateGrid.wgsl.

   ========================================================== */

function patchCentralGravity(shader) {


    /*
    ----------------------------------------------------------
    FIRST:

    remove ONLY Splash's downward gravity term.

    Current upstream:

        cells[id.x].vy =
            encodeFixedPoint(
                floatV.y +
                strength * forceDir.y -
                0.40 * dt
            );

    We accept arbitrary whitespace.
    ----------------------------------------------------------
    */


    const gravityRegex =

        /floatV\.y\s*\+\s*strength\s*\*\s*forceDir\.y\s*-\s*0\.40\s*\*\s*dt/g;


    if (
        !gravityRegex.test(
            shader
        )
    ) {

        throw new Error(

            "Could not find Splash's current '- 0.40 * dt' " +

            "gravity expression in updateGrid.wgsl."

        );

    }


    gravityRegex.lastIndex =
        0;


    shader =

        shader.replace(

            gravityRegex,

            "floatV.y + strength * forceDir.y"

        );



    /*
    ----------------------------------------------------------
    SECOND:

    Inject radial acceleration immediately after Splash
    calculates normalized grid velocity:

        floatV /= mass

    This is the correct point because we're modifying grid
    velocity before Splash stores it back into the grid.

    NO target radius appears anywhere here.
    ----------------------------------------------------------
    */


    const normalizationRegex =

        /floatV\s*\/=\s*decodeFixedPoint\s*\(\s*cells\s*\[\s*id\.x\s*\]\.mass\s*\)\s*;/;


    const match =

        shader.match(
            normalizationRegex
        );


    if (!match) {

        throw new Error(

            "Could not locate Splash grid velocity normalization."

        );

    }


    const centralPhysics = `

            /*
            ===================================================
            ZERO-G CENTRAL POTENTIAL
            ===================================================

            Grid coordinate from the flattened Splash grid.
            */

            let gravityX: f32 =

                f32(

                    i32(id.x) /
                    i32(initBoxSize.z) /
                    i32(initBoxSize.y)

                );


            let gravityY: f32 =

                f32(

                    (

                        i32(id.x) /
                        i32(initBoxSize.z)

                    )

                    %

                    i32(initBoxSize.y)

                );


            let gravityZ: f32 =

                f32(

                    i32(id.x) %
                    i32(initBoxSize.z)

                );


            let gravityPosition =

                vec3f(

                    gravityX,
                    gravityY,
                    gravityZ

                );


            /*
            ===================================================
            CENTER OF THE ZERO-G POTENTIAL

            This is NOT a spherical shell.

            It is one point.
            ===================================================
            */

            let gravityCenter =

                initBoxSize *
                0.5;


            let toCenter =

                gravityCenter -
                gravityPosition;


            /*
            ===================================================
            CENTRAL FIELD

                 a = K r

            Exactly isotropic.

            Notice what DOES NOT EXIST:

                 desiredRadius
                 sphereRadius
                 targetDistance

            Therefore the force cannot directly know what
            spherical surface the water should occupy.

            Fluid pressure + density establish the volume.
            ===================================================
            */

            let centralGravityStrength: f32 =

                0.016;


            floatV +=

                toCenter *

                centralGravityStrength *

                dt;


            /*
            ===================================================
            VERY SMALL PHYSICAL DRAG

            Velocity-proportional dissipation.

            This causes oscillations eventually to lose energy.

            Again this contains absolutely no information about
            spherical shape or target positions.
            ===================================================
            */

            let globalFluidDrag: f32 =

                0.015;


            floatV *=

                max(

                    0.0,

                    1.0 -

                    globalFluidDrag *
                    dt

                );

`;


    shader =

        shader.replace(

            normalizationRegex,

            match[0] +
            centralPhysics

        );


    console.log(

        "✓ Splash gravity replaced with central field"

    );


    return shader;

}



/* ==========================================================
   WGSL IMPORT INLINER
   ========================================================== */

async function inlineWGSL(

    source,
    modulePath

) {

    const regex =

        /import\s+([A-Za-z_$][\w$]*)\s+from\s+['"]([^'"]+\.wgsl)['"]\s*;?/g;


    const imports =

        [
            ...source.matchAll(
                regex
            )
        ];


    for (
        const match of imports
    ) {

        const fullImport =
            match[0];


        const variableName =
            match[1];


        const relativePath =
            match[2];


        const shaderPath =

            resolvePath(

                modulePath,
                relativePath

            );


        let shaderSource =

            await getText(
                shaderPath
            );


        /*
        ------------------------------------------------------
        THE ONE PHYSICS SHADER WE MODIFY
        ------------------------------------------------------
        */

        if (

            shaderPath ===
            "mls-mpm/updateGrid.wgsl"

        ) {

            shaderSource =

                patchCentralGravity(
                    shaderSource
                );

        }


        source =

            source.replace(

                fullImport,

                `const ${variableName} = ${JSON.stringify(shaderSource)};`

            );

    }


    return source;

}



/* ==========================================================
   CAMERA MODULE
   ========================================================== */

async function buildCamera() {

    let source =

        await getText(
            "camera.ts"
        );


    source =

        rewritePackages(
            source
        );


    /*
    ----------------------------------------------------------
    Initialize hover coordinate for touch devices.

    This does not modify physics.
    ----------------------------------------------------------
    */

    const assignmentRegex =

        /this\.canvas\s*=\s*canvas\s*;/;


    if (
        assignmentRegex.test(
            source
        )
    ) {

        source =

            source.replace(

                assignmentRegex,

`this.canvas = canvas;

        this.prevHoverX =
            canvas.clientWidth * 0.5;

        this.prevHoverY =
            canvas.clientHeight * 0.5;

        this.currentHoverX =
            canvas.clientWidth * 0.5;

        this.currentHoverY =
            canvas.clientHeight * 0.5;`

            );

    }


    return moduleURL(

        compile(

            source,
            "camera.ts"

        )

    );

}



/* ==========================================================
   INITIAL PARTICLE CLOUD

   We replace only initDambreak().

   The resulting sphere is merely the INITIAL DISTRIBUTION.

   After frame zero there is no spherical position constraint.
   ========================================================== */

function patchInitialBlob(source) {


    /*
    ----------------------------------------------------------
    Find:

        initDambreak(...) {
             ...
        }

    followed by the next class method:

        reset(

    This is much safer than relying on exact source text.
    ----------------------------------------------------------
    */


    const start =

        source.indexOf(
            "    initDambreak("
        );


    if (
        start === -1
    ) {

        throw new Error(

            "Could not locate initDambreak() in current mls-mpm.ts."

        );

    }


    const end =

        source.indexOf(

            "    reset(",

            start

        );


    if (
        end === -1
    ) {

        throw new Error(

            "Could not locate reset() after initDambreak()."

        );

    }



    const replacement = `

    initDambreak(
        initBoxSize: number[],
        numParticles: number
    ) {

        /*
        ======================================================
        SPHERICAL STARTING MASS

        INITIAL CONDITION ONLY.

        This produces a nearly spherical particle distribution
        around the simulation center.

        The radius produced here is never passed to the GPU
        solver and is never referenced again after initialization.
        ======================================================
        */


        const particlesBuf =

            new ArrayBuffer(

                mlsmpmParticleStructSize *
                this.maxParticleCount

            );


        const spacing =
            0.90;


        const centerX =
            initBoxSize[0] * 0.5;


        const centerY =
            initBoxSize[1] * 0.5;


        const centerZ =
            initBoxSize[2] * 0.5;



        /*
        ------------------------------------------------------
        We need enough lattice sites for requested N particles.

        Radius here describes ONLY where particles begin at t=0.

        It is not a physical target radius.
        ------------------------------------------------------
        */

        const approximateRadius =

            Math.cbrt(

                (

                    numParticles *
                    spacing *
                    spacing *
                    spacing

                )

                *

                (

                    3 /

                    (
                        4 *
                        Math.PI
                    )

                )

            )

            *

            1.075;



        const boxLimit =

            Math.min(

                initBoxSize[0],
                initBoxSize[1],
                initBoxSize[2]

            )

            *

            0.5

            -

            4.5;



        const radius =

            Math.min(

                approximateRadius,

                boxLimit

            );



        const radiusSquared =

            radius *
            radius;



        const candidates: {

            x: number,
            y: number,
            z: number,
            d2: number

        }[] = [];



        /*
        ------------------------------------------------------
        Build full 3D lattice around center.
        ------------------------------------------------------
        */

        for (

            let x =
                centerX -
                radius;

            x <=
                centerX +
                radius;

            x +=
                spacing

        ) {


            for (

                let y =
                    centerY -
                    radius;

                y <=
                    centerY +
                    radius;

                y +=
                    spacing

            ) {


                for (

                    let z =
                        centerZ -
                        radius;

                    z <=
                        centerZ +
                        radius;

                    z +=
                        spacing

                ) {


                    const dx =
                        x -
                        centerX;


                    const dy =
                        y -
                        centerY;


                    const dz =
                        z -
                        centerZ;


                    const d2 =

                        dx * dx +

                        dy * dy +

                        dz * dz;


                    if (
                        d2 <=
                        radiusSquared
                    ) {

                        candidates.push({

                            x,
                            y,
                            z,
                            d2

                        });

                    }

                }

            }

        }



        /*
        ------------------------------------------------------
        Sort radially so taking the first N never creates a
        chopped-off half sphere.
        ------------------------------------------------------
        */

        candidates.sort(

            (
                a,
                b
            ) =>

                a.d2 -
                b.d2

        );



        const actualCount =

            Math.min(

                numParticles,

                this.maxParticleCount,

                candidates.length

            );



        for (

            let n = 0;

            n <
            actualCount;

            n++

        ) {


            const point =
                candidates[n];


            const offset =

                mlsmpmParticleStructSize *
                n;



            const particleViews = {

                position:

                    new Float32Array(

                        particlesBuf,

                        offset,

                        3

                    ),


                v:

                    new Float32Array(

                        particlesBuf,

                        offset + 16,

                        3

                    ),


                C:

                    new Float32Array(

                        particlesBuf,

                        offset + 32,

                        12

                    )

            };



            /*
            --------------------------------------------------
            Tiny particle-level irregularity.

            This prevents us from cheating visually by beginning
            with a mathematically exact shell.
            --------------------------------------------------
            */

            const jitter =
                0.055;


            particleViews.position.set([

                point.x +

                (
                    Math.random() -
                    0.5
                ) *
                jitter,


                point.y +

                (
                    Math.random() -
                    0.5
                ) *
                jitter,


                point.z +

                (
                    Math.random() -
                    0.5
                ) *
                jitter

            ]);



            particleViews.v.set([

                0,
                0,
                0

            ]);



            particleViews.C.fill(
                0
            );

        }



        this.numParticles =
            actualCount;



        console.log(

            "Zero-G initial particle count:",

            actualCount

        );



        /*
        ------------------------------------------------------
        Splash expects exactly numParticles bytes to upload.
        ------------------------------------------------------
        */

        return particlesBuf.slice(

            0,

            mlsmpmParticleStructSize *
            actualCount

        );

    }

`;


    source =

        source.substring(

            0,
            start

        )

        +

        replacement

        +

        source.substring(
            end
        );


    console.log(

        "✓ Splash dam-break initial state replaced with centered blob"

    );


    return source;

}



/* ==========================================================
   BUILD ORIGINAL MLS-MPM MODULE
   ========================================================== */

async function buildMLSMPM() {

    let source =

        await getText(
            "mls-mpm/mls-mpm.ts"
        );


    /*
    ----------------------------------------------------------
    KEEP SPLASH PRESSURE PHYSICS.

    Only increase physical viscosity slightly so deformation
    eventually damps.

    Original current Splash:
        dynamicViscosity: 0.1

    This:
        0.16

    It is still the same constitutive model.
    ----------------------------------------------------------
    */

    source =

        source.replace(

            /dynamicViscosity\s*:\s*0\.1\s*,/,

            "dynamicViscosity: 0.16,"

        );


    source =

        patchInitialBlob(
            source
        );


    source =

        await inlineWGSL(

            source,

            "mls-mpm/mls-mpm.ts"

        );


    return moduleURL(

        compile(

            source,
            "mls-mpm/mls-mpm.ts"

        )

    );

}



/* ==========================================================
   BUILD ORIGINAL SPLASH FLUID RENDERER
   ========================================================== */

async function buildFluidRenderer() {

    let source =

        await getText(

            "render/fluidRender.ts"

        );


    /*
    ----------------------------------------------------------
    NO FLUID RENDERER PHYSICS REPLACEMENT.

    Use Splash's real renderer shaders.
    ----------------------------------------------------------
    */

    source =

        await inlineWGSL(

            source,

            "render/fluidRender.ts"

        );


    return moduleURL(

        compile(

            source,
            "render/fluidRender.ts"

        )

    );

}



/* ==========================================================
   BUILD ORIGINAL MAIN.TS
   ========================================================== */

async function buildMain(

    cameraURL,
    mpmURL,
    rendererURL

) {

    let source =

        await getText(
            "main.ts"
        );



    /* -------------------------------------------------------
       Redirect original local imports.
       ------------------------------------------------------- */


    source =

        source.replace(

            /from\s+['"]\.\/camera['"]/g,

            `from ${JSON.stringify(cameraURL)}`

        );


    source =

        source.replace(

            /from\s+['"]\.\/mls-mpm\/mls-mpm['"]/g,

            `from ${JSON.stringify(mpmURL)}`

        );


    source =

        source.replace(

            /from\s+['"]\.\/render\/fluidRender['"]/g,

            `from ${JSON.stringify(rendererURL)}`

        );


    source =

        rewritePackages(
            source
        );



    /* -------------------------------------------------------
       CUBEMAP

       public/ under Vite becomes repo/public/ when loaded here.
       ------------------------------------------------------- */


    const cubeNames = [

        "posx",
        "negx",

        "posy",
        "negy",

        "posz",
        "negz"

    ];


    for (
        const name of cubeNames
    ) {

        const regex =

            new RegExp(

                `(["'])cubemap\\/${name}\\.png\\1`,

                "g"

            );


        source =

            source.replace(

                regex,

                JSON.stringify(

                    `${REPO}/public/cubemap/${name}.png`

                )

            );

    }



    /*
    ----------------------------------------------------------
    MAKE THE SIMULATION VOLUME CUBIC.

    This DOES NOT constrain water to a sphere.

    It merely gives the floating blob equal free space on X/Y/Z.
    ----------------------------------------------------------
    */


    source =

        source.replace(

            /\{\s*particleCount:\s*40000[^}]+\}/,

`{
    particleCount: 40000,
    initBoxSize: [60, 60, 60],
    initDistance: 64,
    mouseRadius: 13,
    cameraTargetY: 30,
    guiText: 'Small (40,000 particles)'
}`

        );


    source =

        source.replace(

            /\{\s*particleCount:\s*70000[^}]+\}/,

`{
    particleCount: 70000,
    initBoxSize: [70, 70, 70],
    initDistance: 73,
    mouseRadius: 14,
    cameraTargetY: 35,
    guiText: 'Medium (70,000 particles)'
}`

        );


    source =

        source.replace(

            /\{\s*particleCount:\s*100000[^}]+\}/,

`{
    particleCount: 100000,
    initBoxSize: [80, 80, 80],
    initDistance: 82,
    mouseRadius: 15,
    cameraTargetY: 40,
    guiText: 'Large (100,000 particles)'
}`

        );


    source =

        source.replace(

            /\{\s*particleCount:\s*180000[^}]+\}/,

`{
    particleCount: 180000,
    initBoxSize: [92, 92, 92],
    initDistance: 94,
    mouseRadius: 17,
    cameraTargetY: 46,
    guiText: 'Very Large (180,000 particles)'
}`

        );



    /*
    ----------------------------------------------------------
    CAMERA TARGET

    Aim at exact simulation center.
    ----------------------------------------------------------
    */


    source =

        source.replace(

            /camera\.reset\s*\(\s*simulationParam\.initDistance\s*,\s*\[\s*initBoxSize\[0\]\s*\/\s*2\s*,\s*simulationParam\.cameraTargetY\s*,\s*initBoxSize\[2\]\s*\/\s*2\s*\]\s*,\s*mlsmpmFov\s*,\s*mlsmpmZoomRate\s*\)/,

`camera.reset(
    simulationParam.initDistance,
    [
        initBoxSize[0] / 2,
        initBoxSize[1] / 2,
        initBoxSize[2] / 2
    ],
    mlsmpmFov,
    mlsmpmZoomRate
)`

        );



    /*
    ----------------------------------------------------------
    BOX SIZE

    Prevent Splash's slider from closing one side into the
    floating blob.

    The outer simulation box remains large and static.
    ----------------------------------------------------------
    */


    source =

        source.replace(

            /realBoxSize\[2\]\s*=\s*initBoxSize\[2\]\s*\*\s*boxWidthRatio\s*;\?/g,

            `realBoxSize[2] = initBoxSize[2]`

        );



    return moduleURL(

        compile(

            source,
            "main.ts"

        )

    );

}



/* ==========================================================
   TOUCH -> ORIGINAL SPLASH INTERACTION

   Splash already calculates:

       screen point
       depth
       world position
       mouse velocity
       affected grid region
       forceDir

   Therefore we DO NOT create a second force system.

   We only supply finger coordinates.
   ========================================================== */

function installTouchBridge() {


    let pointerID =
        null;


    let hiddenHint =
        false;



    function dispatchMouseMove(

        x,
        y

    ) {


        const event =

            new MouseEvent(

                "mousemove",

                {

                    bubbles:
                        false,

                    cancelable:
                        false,

                    view:
                        window,

                    clientX:
                        x,

                    clientY:
                        y,

                    screenX:
                        x,

                    screenY:
                        y,

                    buttons:
                        0

                }

            );


        canvas.dispatchEvent(
            event
        );

    }



    canvas.addEventListener(

        "pointerdown",

        event => {


            if (

                event.pointerType !==
                "touch"

            ) {

                return;

            }


            event.preventDefault();


            if (
                pointerID !==
                null
            ) {

                return;

            }


            pointerID =
                event.pointerId;


            try {

                canvas.setPointerCapture(
                    pointerID
                );

            }

            catch (_) {}


            dispatchMouseMove(

                event.clientX,
                event.clientY

            );


            if (
                !hiddenHint
            ) {

                hiddenHint =
                    true;


                hint.style.opacity =
                    "0";

            }


            if (
                navigator.vibrate
            ) {

                navigator.vibrate(
                    4
                );

            }

        },

        {
            passive:
                false
        }

    );



    canvas.addEventListener(

        "pointermove",

        event => {


            if (

                event.pointerType !==
                "touch"

            ) {

                return;

            }


            if (

                event.pointerId !==
                pointerID

            ) {

                return;

            }


            event.preventDefault();


            dispatchMouseMove(

                event.clientX,
                event.clientY

            );

        },

        {
            passive:
                false
        }

    );



    function releasePointer(
        event
    ) {


        if (

            event.pointerId !==
            pointerID

        ) {

            return;

        }


        pointerID =
            null;


        /*
        ------------------------------------------------------
        Send interaction far outside the screen.

        This prevents a stationary invisible finger force after
        touch release.
        ------------------------------------------------------
        */


        dispatchMouseMove(

            -10000,
            -10000

        );

    }



    canvas.addEventListener(

        "pointerup",
        releasePointer

    );


    canvas.addEventListener(

        "pointercancel",
        releasePointer

    );

}



/* ==========================================================
   START
   ========================================================== */

async function start() {


    try {


        installTouchBridge();



        status.textContent =
            "Loading Splash camera…";


        const cameraURL =

            await buildCamera();



        status.textContent =
            "Loading original MLS-MPM solver…";


        const mpmURL =

            await buildMLSMPM();



        status.textContent =
            "Loading original Splash fluid renderer…";


        const rendererURL =

            await buildFluidRenderer();



        status.textContent =
            "Starting zero-G WebGPU simulation…";


        const mainURL =

            await buildMain(

                cameraURL,
                mpmURL,
                rendererURL

            );



        await import(
            mainURL
        );



        /*
        ------------------------------------------------------
        Let WebGPU compile the pipelines and populate the first
        simulation/render frames before removing the loading UI.
        ------------------------------------------------------
        */


        setTimeout(

            () => {

                loading.classList.add(
                    "hidden"
                );

            },

            1000

        );


    }

    catch (error) {


        fatal(
            error
        );

    }

}



start();
