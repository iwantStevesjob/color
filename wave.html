<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover
    "
>

<title>Splash WebGPU MVP</title>

<style>
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #000;
        touch-action: none;
        font-family: system-ui, sans-serif;
    }

    #fluidCanvas {
        display: block;
        width: 100vw;
        height: 100dvh;
        touch-action: none;
    }

    #loading {
        position: fixed;
        inset: 0;
        z-index: 1000;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #05080d;
        color: white;

        font-size: 14px;
        text-align: center;

        padding: 30px;

        transition: opacity 0.35s;
    }

    #loading.hidden {
        opacity: 0;
        pointer-events: none;
    }

    #status {
        max-width: 520px;
        line-height: 1.5;
    }

    #ui-container {
        position: fixed;
        z-index: 20;

        left: max(12px, env(safe-area-inset-left));
        top: max(12px, env(safe-area-inset-top));

        padding: 10px 12px;

        border-radius: 12px;

        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);

        color: white;

        font-size: 12px;
    }

    #slider-container {
        margin-top: 8px;
    }

    #slider {
        width: 160px;
    }

    #howto-container {
        position: fixed;
        z-index: 20;

        left: 50%;
        bottom: calc(
            14px +
            env(safe-area-inset-bottom)
        );

        transform: translateX(-50%);

        padding: 8px 13px;

        border-radius: 999px;

        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(10px);

        color: rgba(255,255,255,0.78);

        font-size: 11px;

        pointer-events: none;
        white-space: nowrap;
    }

    #debug-info {
        position: fixed;
        z-index: 50;

        right: 10px;
        top: 10px;

        max-width: 70vw;

        padding: 6px 9px;

        border-radius: 8px;

        background: rgba(0,0,0,0.45);

        color: #fff;

        font-family: monospace;
        font-size: 10px;

        pointer-events: none;
    }

    /* lil-gui generated by Splash */
    .lil-gui.root {
        --width: 270px;

        top: 56px !important;
        right: 10px !important;

        max-height: calc(100dvh - 80px);
    }

    @media (max-width: 600px) {

        .lil-gui.root {
            --width: 215px;
            font-size: 10px;
        }

        #ui-container {
            font-size: 10px;
        }

        #slider {
            width: 120px;
        }
    }
</style>


<!--
    Splash is TypeScript.

    The original repository normally uses Vite to compile it.
    For a SINGLE HTML FILE, we load TypeScript's compiler in
    the browser and compile the exact GitHub source dynamically.
-->
<script
    src="https://cdn.jsdelivr.net/npm/typescript@5.7.2/lib/typescript.js"
></script>

</head>


<body>

<div id="loading">
    <div id="status">
        Loading Splash WebGPU…
    </div>
</div>


<!--
    These element IDs are required by Splash's original main.ts.
-->
<div id="ui-container">

    <label>
        <input
            type="checkbox"
            id="particle"
        >
        Particle renderer
    </label>

    <div id="slider-container">

        <label for="slider">
            Box width
        </label>

        <br>

        <input
            type="range"
            id="slider"
            min="0"
            max="100"
            value="100"
        >

        <span id="slider-value"></span>

    </div>

</div>


<div id="howto-container">
    Drag finger through water
</div>


<div id="debug-info">
    <span id="error-reason">
        loading…
    </span>
</div>


<canvas id="fluidCanvas"></canvas>



<script type="module">

/*
================================================================
 SPLASH SINGLE-FILE LOADER
================================================================

This DOES NOT contain a replacement fluid solver.

At runtime we fetch:

    main.ts

    camera.ts

    mls-mpm/mls-mpm.ts

    render/fluidRender.ts

and the WGSL shaders imported by those files directly from:

    https://github.com/matsuoka-601/Splash

Then:

1. WGSL imports are converted to strings.
2. TypeScript is transpiled to native browser ES modules.
3. The resulting modules execute normally.
4. Splash creates the real GPU buffers / pipelines itself.

================================================================
*/


const REPOSITORY =
    "https://raw.githubusercontent.com/matsuoka-601/Splash/main";


const TS = window.ts;


const statusElement =
    document.getElementById("status");


const loadingElement =
    document.getElementById("loading");


const canvas =
    document.getElementById("fluidCanvas");



// ============================================================
// ERROR REPORTING
// ============================================================

function showError(error) {

    console.error(error);

    statusElement.innerHTML =
        `
        <b>Splash failed to start.</b><br><br>
        ${String(
            error?.stack ||
            error?.message ||
            error
        )}
        `;

    document.getElementById(
        "error-reason"
    ).textContent =
        String(
            error?.message ||
            error
        );

}


window.addEventListener(
    "error",
    event => {

        console.error(
            "Window error:",
            event.error
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    event => {

        console.error(
            "Unhandled promise:",
            event.reason
        );

    }
);



// ============================================================
// CHECK WEBGPU
// ============================================================

if (!navigator.gpu) {

    throw new Error(

        "WebGPU is not available in this browser. " +

        "Use a current WebGPU-capable browser over HTTPS."

    );

}



// ============================================================
// FETCH HELPERS
// ============================================================

async function getText(path) {

    const url =
        `${REPOSITORY}/${path}`;


    statusElement.textContent =
        `Loading ${path}…`;


    const response =
        await fetch(
            url,
            {
                cache: "no-cache"
            }
        );


    if (!response.ok) {

        throw new Error(
            `Could not load ${path}: HTTP ${response.status}`
        );

    }


    return await response.text();

}



// ============================================================
// WGSL IMPORT RESOLUTION
// ============================================================

function directoryOf(path) {

    const slash =
        path.lastIndexOf("/");


    if (slash < 0)
        return "";


    return path.substring(
        0,
        slash + 1
    );

}


function normalizePath(path) {

    const parts = [];


    for (
        const part of path.split("/")
    ) {

        if (
            part === "" ||
            part === "."
        ) {

            continue;

        }


        if (
            part === ".."
        ) {

            parts.pop();

        }
        else {

            parts.push(part);

        }

    }


    return parts.join("/");

}


function resolveRelativePath(
    parentPath,
    relativePath
) {

    return normalizePath(

        directoryOf(parentPath) +
        relativePath

    );

}



// ============================================================
// INLINE THE REPOSITORY'S ACTUAL WGSL
// ============================================================

async function inlineWGSLImports(
    source,
    modulePath
) {

    /*
        Matches things such as:

        import clearGrid from './clearGrid.wgsl'

        The shader itself is NOT rewritten.
        The exact text gets fetched from GitHub.
    */


    const expression =

        /import\s+([A-Za-z_$][\w$]*)\s+from\s+['"]([^'"]+\.wgsl)['"]\s*;?/g;


    const imports = [
        ...source.matchAll(
            expression
        )
    ];


    for (
        const match of imports
    ) {

        const wholeImport =
            match[0];


        const variableName =
            match[1];


        const relativeShader =
            match[2];


        const shaderPath =
            resolveRelativePath(

                modulePath,
                relativeShader

            );


        const shaderSource =
            await getText(
                shaderPath
            );


        /*
            JSON.stringify creates a safe JavaScript string
            containing the complete shader source.
        */

        const replacement =

            `const ${variableName} = ${JSON.stringify(shaderSource)};`;


        source =
            source.replace(

                wholeImport,
                replacement

            );

    }


    return source;

}



// ============================================================
// EXTERNAL LIBRARIES USED BY SPLASH
// ============================================================

function rewriteExternalImports(
    source
) {

    /*
        package.json from Splash uses:

            wgpu-matrix 3.3.0
            lil-gui 0.20.0

        We load matching browser ESM versions directly.
    */


    source =
        source.replace(

            /from\s+['"]wgpu-matrix['"]/g,

            `from "https://cdn.jsdelivr.net/npm/wgpu-matrix@3.3.0/+esm"`

        );


    source =
        source.replace(

            /from\s+['"]lil-gui['"]/g,

            `from "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/+esm"`

        );


    return source;

}



// ============================================================
// TYPESCRIPT -> JAVASCRIPT
// ============================================================

function compileTypeScript(
    source,
    filename
) {

    const output =
        TS.transpileModule(

            source,

            {

                fileName:
                    filename,

                compilerOptions: {

                    target:
                        TS.ScriptTarget.ES2022,

                    module:
                        TS.ModuleKind.ES2022,

                    moduleResolution:
                        TS.ModuleResolutionKind.Bundler,

                    strict:
                        false,

                    useDefineForClassFields:
                        false,

                    removeComments:
                        false

                }

            }

        );


    if (
        output.diagnostics &&
        output.diagnostics.length
    ) {

        console.warn(
            "TypeScript diagnostics:",
            output.diagnostics
        );

    }


    return output.outputText;

}



// ============================================================
// CREATE BROWSER MODULE
// ============================================================

function createModuleURL(
    javascriptSource
) {

    const blob =
        new Blob(

            [
                javascriptSource
            ],

            {
                type:
                    "text/javascript"
            }

        );


    return URL.createObjectURL(
        blob
    );

}



// ============================================================
// BUILD CAMERA MODULE
// ============================================================

async function buildCameraModule() {

    let source =
        await getText(
            "camera.ts"
        );


    source =
        rewriteExternalImports(
            source
        );


    /*
    ------------------------------------------------------------
    SMALL MOBILE-SAFETY PATCH

    The original desktop camera gets mouse coordinates only after
    the first mousemove event.

    Phones do not have hover.

    Initializing them to screen center prevents undefined/NaN mouse
    coordinates before the first finger movement.

    This DOES NOT touch MLS-MPM or its shaders.
    ------------------------------------------------------------
    */

    source =
        source.replace(

            "this.canvas = canvas;",

            `
            this.canvas = canvas;

            this.prevHoverX =
                canvas.clientWidth * 0.5;

            this.prevHoverY =
                canvas.clientHeight * 0.5;

            this.currentHoverX =
                canvas.clientWidth * 0.5;

            this.currentHoverY =
                canvas.clientHeight * 0.5;
            `

        );


    const javascript =
        compileTypeScript(

            source,
            "camera.ts"

        );


    return createModuleURL(
        javascript
    );

}



// ============================================================
// BUILD MLS-MPM MODULE
// ============================================================

async function buildMLSMPMModule() {

    /*
        This loads the repository's actual:

        clearGrid.wgsl
        p2g_1.wgsl
        p2g_2.wgsl
        updateGrid.wgsl
        g2p.wgsl
        copyPosition.wgsl
        p2gDensity.wgsl
        clearDensityGrid.wgsl
        castDensityGrid.wgsl
    */


    let source =
        await getText(

            "mls-mpm/mls-mpm.ts"

        );


    source =
        await inlineWGSLImports(

            source,
            "mls-mpm/mls-mpm.ts"

        );


    const javascript =
        compileTypeScript(

            source,
            "mls-mpm/mls-mpm.ts"

        );


    return createModuleURL(
        javascript
    );

}



// ============================================================
// BUILD FLUID RENDERER
// ============================================================

async function buildFluidRendererModule() {

    /*
        This loads Splash's real screen-space renderer and:

        narrowRangeFilter.wgsl
        fluid.wgsl
        fullScreen.wgsl
        thicknessMap.wgsl
        gaussian.wgsl
        depthMap.wgsl
        sphere.wgsl
        bgColor.wgsl
        densityRaymarch.wgsl
    */


    let source =
        await getText(

            "render/fluidRender.ts"

        );


    source =
        await inlineWGSLImports(

            source,
            "render/fluidRender.ts"

        );


    const javascript =
        compileTypeScript(

            source,
            "render/fluidRender.ts"

        );


    return createModuleURL(
        javascript
    );

}



// ============================================================
// TOUCH -> SPLASH MOUSE INPUT BRIDGE
// ============================================================

function installTouchBridge() {

    /*
    ------------------------------------------------------------
    Original Splash interaction expects desktop mousemove.

    Touch screens do not provide hover, so this bridge translates
    finger movement into the same MouseEvent coordinates that
    Splash already consumes.

    We intentionally DON'T send mousedown for touch.

    That means:

        finger movement = stir / influence fluid

    rather than:

        finger movement = camera rotation

    Mouse behavior on desktop remains original Splash behavior.

    Later we can add two-finger camera controls separately.
    ------------------------------------------------------------
    */


    let touchPointerId =
        null;


    function sendMove(event) {

        canvas.dispatchEvent(

            new MouseEvent(

                "mousemove",

                {

                    bubbles:
                        false,

                    cancelable:
                        false,

                    clientX:
                        event.clientX,

                    clientY:
                        event.clientY,

                    screenX:
                        event.screenX,

                    screenY:
                        event.screenY,

                    buttons:
                        0

                }

            )

        );

    }


    canvas.addEventListener(

        "pointerdown",

        event => {

            if (
                event.pointerType !==
                "touch"
            )
                return;


            /*
                Prevent the browser from generating compatibility
                mouse-down events, because Splash would interpret
                those as camera dragging.
            */

            event.preventDefault();


            if (
                touchPointerId !==
                null
            )
                return;


            touchPointerId =
                event.pointerId;


            try {

                canvas.setPointerCapture(
                    event.pointerId
                );

            }
            catch (_) {}


            sendMove(
                event
            );

        },

        {
            passive: false
        }

    );


    canvas.addEventListener(

        "pointermove",

        event => {

            if (
                event.pointerType !==
                "touch"
            )
                return;


            if (
                event.pointerId !==
                touchPointerId
            )
                return;


            event.preventDefault();


            sendMove(
                event
            );

        },

        {
            passive: false
        }

    );


    function finishTouch(
        event
    ) {

        if (
            event.pointerId !==
            touchPointerId
        )
            return;


        touchPointerId =
            null;

    }


    canvas.addEventListener(
        "pointerup",
        finishTouch
    );


    canvas.addEventListener(
        "pointercancel",
        finishTouch
    );

}



// ============================================================
// BUILD ORIGINAL SPLASH MAIN
// ============================================================

async function buildMainModule(

    cameraURL,
    simulatorURL,
    rendererURL

) {

    let source =
        await getText(
            "main.ts"
        );


    /*
    ------------------------------------------------------------
    Replace only local MODULE LOCATIONS.

    Their actual contents are still the repository source we just
    loaded above.
    ------------------------------------------------------------
    */


    source =
        source.replaceAll(

            "'./camera'",

            JSON.stringify(
                cameraURL
            )

        );


    source =
        source.replaceAll(

            '"./camera"',

            JSON.stringify(
                cameraURL
            )

        );


    source =
        source.replaceAll(

            "'./mls-mpm/mls-mpm'",

            JSON.stringify(
                simulatorURL
            )

        );


    source =
        source.replaceAll(

            '"./mls-mpm/mls-mpm"',

            JSON.stringify(
                simulatorURL
            )

        );


    source =
        source.replaceAll(

            "'./render/fluidRender'",

            JSON.stringify(
                rendererURL
            )

        );


    source =
        source.replaceAll(

            '"./render/fluidRender"',

            JSON.stringify(
                rendererURL
            )

        );


    source =
        rewriteExternalImports(
            source
        );



    /*
    ------------------------------------------------------------
    SPLASH normally serves cubemaps from Vite's /public folder.

    Since this is one HTML file, redirect those asset requests to
    their exact GitHub repository locations.
    ------------------------------------------------------------
    */


    source =
        source.replaceAll(

            "'cubemap/",

            `'${REPOSITORY}/public/cubemap/`

        );


    source =
        source.replaceAll(

            '"cubemap/',

            `"${REPOSITORY}/public/cubemap/`

        );



    /*
    ------------------------------------------------------------
    Keep the author's normal 70,000-particle default.

    main.ts already defines:

        40,000
        70,000
        100,000
        180,000

    and defaults to the Medium 70K setting.

    No particle solver is changed here.
    ------------------------------------------------------------
    */


    const javascript =
        compileTypeScript(

            source,
            "main.ts"

        );


    return createModuleURL(
        javascript
    );

}



// ============================================================
// BOOT
// ============================================================

async function boot() {

    try {

        installTouchBridge();


        statusElement.textContent =
            "Loading Splash camera…";


        const cameraURL =
            await buildCameraModule();



        statusElement.textContent =
            "Loading MLS-MPM solver…";


        const simulatorURL =
            await buildMLSMPMModule();



        statusElement.textContent =
            "Loading screen-space fluid renderer…";


        const rendererURL =
            await buildFluidRendererModule();



        statusElement.textContent =
            "Starting Splash WebGPU…";


        const mainURL =
            await buildMainModule(

                cameraURL,
                simulatorURL,
                rendererURL

            );



        /*
            Importing main executes Splash's own main().
        */

        await import(
            mainURL
        );



        /*
            Give WebGPU a moment to create the pipelines and
            initialize the first simulation.
        */

        setTimeout(

            () => {

                loadingElement
                    .classList
                    .add(
                        "hidden"
                    );

            },

            900

        );

    }
    catch (error) {

        showError(
            error
        );

    }

}


boot();

</script>

</body>
</html>
