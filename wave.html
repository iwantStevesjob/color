<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Three.js Splash Fluid Demo</title>

<style>
    * {

    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #090b0f;
        font-family:
            Inter,
            system-ui,

            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
    }

    canvas {

    }

    #ui {

            0 15px 50px rgba(0, 0, 0, 0.4);
    }

    #ui h1 {

    }
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>
</head>

<body>

<div id="ui">
    <h1>SPLASH — THREE.JS</h1>
    <div class="sub">Realtime pseudo-fluid / Marching Cubes</div>

    <div class="row">
        <button id="reset">Reset</button>
        <button id="pour">Pour</button>
    </div>

    <div class="row">
        <button id="pause">Pause</button>
        <button id="wave">Wave</button>
    </div>

    <div class="row">
        <label>Gravity</label>
        <input id="gravity" type="range"
               min="0" max="25" step="0.1" value="10">
    </div>

    <div class="row">
        <label>Cohesion</label>
        <input id="cohesion" type="range"
               min="0" max="12" step="0.1" value="5">
    </div>

    <div class="row">
        <label>Viscosity</label>
        <input id="viscosity" type="range"
               min="0" max="8" step="0.1" value="2.5">
    </div>

    <div class="row">
        <label>Surface</label>
        <input id="surface" type="range"
               min="0.35" max="1.5" step="0.01" value="0.82">
    </div>

    <div class="row">
        <label>Blob radius</label>
        <input id="blobRadius" type="range"
               min="0.08" max="0.32" step="0.01" value="0.18">
    </div>
</div>

<div id="stats">FPS --</div>
<div id="tip">Drag empty space to orbit • drag the liquid to disturb it</div>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { MarchingCubes } from "three/addons/objects/MarchingCubes.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";


// ============================================================
// CONFIG
// ============================================================

const CONFIG = {

    particleCount: 155,

    tank: {
        width: 5.0,
        height: 4.6,
        depth: 3.6
    },

    particleRadius: 0.115,

    gravity: 10,
    cohesion: 5,
    viscosity: 2.5,

    restitution: 0.12,

    neighborRadius: 0.55,

    surfaceIsolation: 0.82,
    blobRadius: 0.18,

    simulationSubsteps: 3

};


// ============================================================
// THREE SCENE
// ============================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x0b1018);


const camera = new THREE.PerspectiveCamera(
    42,
    innerWidth / innerHeight,
    0.05,
    100
);

camera.position.set(7.1, 5.2, 8.5);


const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(
    Math.min(devicePixelRatio, 2)
);

renderer.setSize(innerWidth, innerHeight);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);


// ============================================================
// ENVIRONMENT
// ============================================================

const pmremGenerator =
    new THREE.PMREMGenerator(renderer);

const environment =
    new RoomEnvironment();

scene.environment =
    pmremGenerator.fromScene(
        environment,
        0.04
    ).texture;


// ============================================================
// CAMERA
// ============================================================

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.target.set(0, 1.4, 0);

controls.enableDamping = true;

controls.dampingFactor = 0.055;

controls.minDistance = 4;
controls.maxDistance = 17;

controls.maxPolarAngle =
    Math.PI * 0.49;


// ============================================================
// LIGHTING
// ============================================================

const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        4
    );

keyLight.position.set(
    -5,
    8,
    5
);

keyLight.castShadow = true;

keyLight.shadow.mapSize.set(
    2048,
    2048
);

keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -8;

scene.add(keyLight);


const fillLight =
    new THREE.DirectionalLight(
        0x6da8ff,
        1.5
    );

fillLight.position.set(
    5,
    3,
    -4
);

scene.add(fillLight);


// ============================================================
// FLOOR
// ============================================================

const floorMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x20242b,

        roughness: 0.32,
        metalness: 0.1

    });


const floor =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            30,
            30
        ),

        floorMaterial

    );

floor.rotation.x =
    -Math.PI / 2;

floor.receiveShadow = true;

scene.add(floor);


// ============================================================
// TANK
// ============================================================

const tankGroup =
    new THREE.Group();

scene.add(tankGroup);


const tankGeometry =
    new THREE.BoxGeometry(
        CONFIG.tank.width,
        CONFIG.tank.height,
        CONFIG.tank.depth
    );


const edges =
    new THREE.EdgesGeometry(
        tankGeometry
    );


const tankLines =
    new THREE.LineSegments(

        edges,

        new THREE.LineBasicMaterial({

            color: 0xffffff,

            transparent: true,

            opacity: 0.15

        })

    );

tankLines.position.y =
    CONFIG.tank.height / 2;

tankGroup.add(tankLines);


// ============================================================
// GLASS
// ============================================================

const glassMaterial =
    new THREE.MeshPhysicalMaterial({

        color: 0x9bcfff,

        transparent: true,

        opacity: 0.065,

        roughness: 0.05,

        metalness: 0,

        transmission: 0.9,

        thickness: 0.05,

        side: THREE.DoubleSide

    });


function addWall(w, h, pos, rotation) {

    const geometry =
        new THREE.PlaneGeometry(
            w,
            h
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            glassMaterial
        );

    mesh.position.copy(pos);

    mesh.rotation.set(
        rotation.x,
        rotation.y,
        rotation.z
    );

    tankGroup.add(mesh);

}


// back

addWall(

    CONFIG.tank.width,
    CONFIG.tank.height,

    new THREE.Vector3(
        0,
        CONFIG.tank.height / 2,
        -CONFIG.tank.depth / 2
    ),

    new THREE.Euler(
        0,
        0,
        0
    )

);


// left

addWall(

    CONFIG.tank.depth,
    CONFIG.tank.height,

    new THREE.Vector3(
        -CONFIG.tank.width / 2,
        CONFIG.tank.height / 2,
        0
    ),

    new THREE.Euler(
        0,
        Math.PI / 2,
        0
    )

);


// right

addWall(

    CONFIG.tank.depth,
    CONFIG.tank.height,

    new THREE.Vector3(
        CONFIG.tank.width / 2,
        CONFIG.tank.height / 2,
        0
    ),

    new THREE.Euler(
        0,
        -Math.PI / 2,
        0
    )

);


// ============================================================
// PARTICLES
// ============================================================

class FluidParticle {

    constructor() {

        this.position =
            new THREE.Vector3();

        this.velocity =
            new THREE.Vector3();

        this.force =
            new THREE.Vector3();

    }

}


const particles = [];


for (
    let i = 0;
    i < CONFIG.particleCount;
    i++
) {

    particles.push(
        new FluidParticle()
    );

}


// ============================================================
// INITIALIZE PARTICLES
// ============================================================

function resetParticles() {

    const spacing = 0.32;

    let index = 0;

    const cols = 9;
    const rows = 10;
    const depthCount = 3;

    for (
        let y = 0;
        y < rows;
        y++
    ) {

        for (
            let x = 0;
            x < cols;
            x++
        ) {

            for (
                let z = 0;
                z < depthCount;
                z++
            ) {

                if (
                    index >=
                    particles.length
                ) break;

                const p =
                    particles[index++];

                p.position.set(

                    -1.15 +
                    x * spacing,

                    0.45 +
                    y * spacing,

                    -0.38 +
                    z * spacing

                );

                p.velocity.set(
                    0,
                    0,
                    0
                );

            }

        }

    }


    while (
        index <
        particles.length
    ) {

        const p =
            particles[index++];

        p.position.set(

            THREE.MathUtils.randFloat(
                -1,
                1
            ),

            THREE.MathUtils.randFloat(
                1,
                3
            ),

            THREE.MathUtils.randFloat(
                -0.5,
                0.5
            )

        );

        p.velocity.set(
            0,
            0,
            0
        );

    }

}


resetParticles();


// ============================================================
// SPATIAL HASH
// ============================================================

const hash =
    new Map();


function hashKey(
    x,
    y,
    z
) {

    return `${x}|${y}|${z}`;

}


function buildSpatialHash() {

    hash.clear();

    const size =
        CONFIG.neighborRadius;

    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        const p =
            particles[i];

        const gx =
            Math.floor(
                p.position.x / size
            );

        const gy =
            Math.floor(
                p.position.y / size
            );

        const gz =
            Math.floor(
                p.position.z / size
            );

        const key =
            hashKey(
                gx,
                gy,
                gz
            );

        if (
            !hash.has(key)
        ) {

            hash.set(
                key,
                []
            );

        }

        hash
            .get(key)
            .push(i);

    }

}


// ============================================================
// FLUID FORCES
// ============================================================

const delta =
    new THREE.Vector3();

const velocityDelta =
    new THREE.Vector3();

const neighborRadiusSq =
    CONFIG.neighborRadius *
    CONFIG.neighborRadius;


function simulateFluid(dt) {

    buildSpatialHash();


    // gravity

    for (
        const p of particles
    ) {

        p.force.set(
            0,
            -CONFIG.gravity,
            0
        );

    }


    const cellSize =
        CONFIG.neighborRadius;


    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        const a =
            particles[i];

        const gx =
            Math.floor(
                a.position.x /
                cellSize
            );

        const gy =
            Math.floor(
                a.position.y /
                cellSize
            );

        const gz =
            Math.floor(
                a.position.z /
                cellSize
            );


        for (
            let ox = -1;
            ox <= 1;
            ox++
        ) {

            for (
                let oy = -1;
                oy <= 1;
                oy++
            ) {

                for (
                    let oz = -1;
                    oz <= 1;
                    oz++
                ) {

                    const list =
                        hash.get(

                            hashKey(
                                gx + ox,
                                gy + oy,
                                gz + oz
                            )

                        );

                    if (!list)
                        continue;


                    for (
                        const j of list
                    ) {

                        if (
                            j === i
                        ) continue;


                        const b =
                            particles[j];

                        delta.subVectors(
                            b.position,
                            a.position
                        );

                        const distSq =
                            delta.lengthSq();

                        if (
                            distSq >
                            neighborRadiusSq
                        )
                            continue;


                        const dist =
                            Math.sqrt(
                                distSq
                            ) + 0.0001;


                        const q =
                            1 -
                            dist /
                            CONFIG.neighborRadius;


                        // ----------------------------------
                        // Cohesion / pseudo pressure
                        // ----------------------------------

                        const desiredDistance =
                            CONFIG.particleRadius *
                            2.15;


                        const direction =
                            delta.multiplyScalar(
                                1 / dist
                            );


                        let pressure = 0;


                        if (
                            dist <
                            desiredDistance
                        ) {

                            pressure =
                                -(
                                    desiredDistance -
                                    dist
                                ) *
                                22;

                        }
                        else {

                            pressure =
                                q *
                                CONFIG.cohesion *
                                0.85;

                        }


                        a.force.addScaledVector(
                            direction,
                            pressure
                        );


                        // ----------------------------------
                        // Viscosity
                        // ----------------------------------

                        velocityDelta.subVectors(
                            b.velocity,
                            a.velocity
                        );


                        a.force.addScaledVector(

                            velocityDelta,

                            q *
                            CONFIG.viscosity *
                            0.075

                        );

                    }

                }

            }

        }

    }


    // integrate

    for (
        const p of particles
    ) {

        p.velocity.addScaledVector(
            p.force,
            dt
        );

        p.velocity.multiplyScalar(
            0.997
        );

        p.position.addScaledVector(
            p.velocity,
            dt
        );

        collideTank(p);

    }

}


// ============================================================
// TANK COLLISION
// ============================================================

function collideTank(p) {

    const r =
        CONFIG.particleRadius;

    const halfW =
        CONFIG.tank.width / 2;

    const halfD =
        CONFIG.tank.depth / 2;


    if (
        p.position.x <
        -halfW + r
    ) {

        p.position.x =
            -halfW + r;

        p.velocity.x =
            Math.abs(
                p.velocity.x
            ) *
            CONFIG.restitution;

    }


    if (
        p.position.x >
        halfW - r
    ) {

        p.position.x =
            halfW - r;

        p.velocity.x =
            -Math.abs(
                p.velocity.x
            ) *
            CONFIG.restitution;

    }


    if (
        p.position.z <
        -halfD + r
    ) {

        p.position.z =
            -halfD + r;

        p.velocity.z =
            Math.abs(
                p.velocity.z
            ) *
            CONFIG.restitution;

    }


    if (
        p.position.z >
        halfD - r
    ) {

        p.position.z =
            halfD - r;

        p.velocity.z =
            -Math.abs(
                p.velocity.z
            ) *
            CONFIG.restitution;

    }


    if (
        p.position.y <
        r
    ) {

        p.position.y =
            r;

        p.velocity.y =
            Math.abs(
                p.velocity.y
            ) *
            CONFIG.restitution;

        p.velocity.x *= 0.94;
        p.velocity.z *= 0.94;

    }


    if (
        p.position.y >
        CONFIG.tank.height - r
    ) {

        p.position.y =
            CONFIG.tank.height - r;

        p.velocity.y =
            -Math.abs(
                p.velocity.y
            ) *
            CONFIG.restitution;

    }

}


// ============================================================
// MARCHING CUBES LIQUID
// ============================================================

const fluidMaterial =
    new THREE.MeshPhysicalMaterial({

        color: 0x2a7dff,

        metalness: 0.0,

        roughness: 0.06,

        transmission: 0.83,

        thickness: 1.2,

        ior: 1.333,

        clearcoat: 1,

        clearcoatRoughness: 0.08,

        specularIntensity: 1.5,

        transparent: true,

        opacity: 0.92,

        side: THREE.DoubleSide

    });


const resolution = 52;


const effect =
    new MarchingCubes(

        resolution,

        fluidMaterial,

        true,

        true,
        25000

    );


effect.enableUvs = false;

effect.enableColors = false;

effect.castShadow = true;

effect.receiveShadow = true;


effect.scale.set(

    CONFIG.tank.width,
    CONFIG.tank.height,
    CONFIG.tank.depth

);


effect.position.set(

    -CONFIG.tank.width / 2,

    0,

    -CONFIG.tank.depth / 2

);


scene.add(effect);


// ============================================================
// UPDATE LIQUID FIELD
// ============================================================

function updateFluidMesh() {

    effect.reset();

    const strength =
        0.82;

    const subtract =
        Math.max(
            7,
            12 /
            CONFIG.blobRadius
        );


    for (
        const p of particles
    ) {

        // convert world -> marching cubes normalized coordinates

        const x =
            (
                p.position.x +
                CONFIG.tank.width / 2
            ) /
            CONFIG.tank.width;

        const y =
            p.position.y /
            CONFIG.tank.height;

        const z =
            (
                p.position.z +
                CONFIG.tank.depth / 2
            ) /
            CONFIG.tank.depth;


        effect.addBall(

            x,
            y,
            z,

            strength,

            subtract

        );

    }


    effect.isolation =
        28 *
        CONFIG.surfaceIsolation;

}


// ============================================================
// DEBUG PARTICLES
// ============================================================

const particleGeometry =
    new THREE.SphereGeometry(
        CONFIG.particleRadius,
        10,
        8
    );


const particleMaterial =
    new THREE.MeshBasicMaterial({

        color: 0xffffff,

        transparent: true,

        opacity: 0.17

    });


const particleDebug =
    new THREE.InstancedMesh(

        particleGeometry,

        particleMaterial,

        particles.length

    );


particleDebug.visible = false;

scene.add(particleDebug);


const dummy =
    new THREE.Object3D();


function updateDebugParticles() {

    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        dummy.position.copy(
            particles[i].position
        );

        dummy.updateMatrix();

        particleDebug.setMatrixAt(
            i,
            dummy.matrix
        );

    }

    particleDebug.instanceMatrix.needsUpdate =
        true;

}


// ============================================================
// INTERACTION
// ============================================================

const raycaster =
    new THREE.Raycaster();

const pointer =
    new THREE.Vector2();

const interactionPlane =
    new THREE.Plane();

const hitPoint =
    new THREE.Vector3();

let pointerDown = false;

let disturbingFluid = false;

let lastPointerX = 0;
let lastPointerY = 0;


renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        pointerDown = true;

        lastPointerX =
            event.clientX;

        lastPointerY =
            event.clientY;

        updatePointer(event);

        raycaster.setFromCamera(
            pointer,
            camera
        );


        // plane roughly through center of liquid

        interactionPlane.setFromNormalAndCoplanarPoint(

            camera
                .getWorldDirection(
                    new THREE.Vector3()
                ),

            new THREE.Vector3(
                0,
                1.5,
                0
            )

        );


        if (
            raycaster.ray.intersectPlane(
                interactionPlane,
                hitPoint
            )
        ) {

            disturbingFluid =
                isNearFluid(hitPoint);

            if (disturbingFluid) {

                controls.enabled =
                    false;

                disturb(
                    hitPoint,
                    new THREE.Vector3()
                );

            }

        }

    }
);


renderer.domElement.addEventListener(
    "pointermove",
    event => {

        if (
            !pointerDown ||
            !disturbingFluid
        )
            return;


        updatePointer(event);

        raycaster.setFromCamera(
            pointer,
            camera
        );


        if (
            raycaster.ray.intersectPlane(
                interactionPlane,
                hitPoint
            )
        ) {

            const dx =
                event.clientX -
                lastPointerX;

            const dy =
                event.clientY -
                lastPointerY;


            const cameraRight =
                new THREE.Vector3(
                    1,
                    0,
                    0
                )
                .applyQuaternion(
                    camera.quaternion
                );


            const cameraUp =
                new THREE.Vector3(
                    0,
                    1,
                    0
                )
                .applyQuaternion(
                    camera.quaternion
                );


            const impulse =
                cameraRight
                .multiplyScalar(
                    dx * 0.022
                )
                .add(
                    cameraUp.multiplyScalar(
                        -dy * 0.022
                    )
                );


            disturb(
                hitPoint,
                impulse
            );

        }


        lastPointerX =
            event.clientX;

        lastPointerY =
            event.clientY;

    }
);


window.addEventListener(
    "pointerup",
    () => {

        pointerDown = false;

        disturbingFluid =
            false;

        controls.enabled =
            true;

    }
);


function updatePointer(event) {

    pointer.x =
        (
            event.clientX /
            innerWidth
        ) * 2 - 1;

    pointer.y =
        -(
            event.clientY /
            innerHeight
        ) * 2 + 1;

}


function isNearFluid(point) {

    let closest =
        Infinity;

    for (
        const p of particles
    ) {

        closest =
            Math.min(
                closest,
                p.position.distanceToSquared(
                    point
                )
            );

    }

    return closest < 1.7;

}


function disturb(
    point,
    impulse
) {

    const radius = 1.25;

    const radiusSq =
        radius * radius;


    for (
        const p of particles
    ) {

        const d2 =
            p.position.distanceToSquared(
                point
            );

        if (
            d2 >
            radiusSq
        )
            continue;


        const falloff =
            1 -
            Math.sqrt(d2) /
            radius;


        p.velocity.addScaledVector(
            impulse,
            falloff
        );


        // little outward pulse

        delta.subVectors(
            p.position,
            point
        );

        if (
            delta.lengthSq() >
            0.001
        ) {

            delta
                .normalize()
                .multiplyScalar(
                    falloff * 0.035
                );

            p.velocity.add(
                delta
            );

        }

    }

}


// ============================================================
// POUR
// ============================================================

function pourFluid() {

    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        const p =
            particles[i];

        p.position.set(

            THREE.MathUtils.randFloat(
                -0.65,
                0.65
            ),

            THREE.MathUtils.randFloat(
                3.7,
                5.3
            ),

            THREE.MathUtils.randFloat(
                -0.4,
                0.4
            )

        );

        p.velocity.set(

            THREE.MathUtils.randFloat(
                -0.25,
                0.25
            ),

            THREE.MathUtils.randFloat(
                -0.5,
                0
            ),

            THREE.MathUtils.randFloat(
                -0.25,
                0.25
            )

        );

    }

}


// ============================================================
// WAVE
// ============================================================

function makeWave() {

    for (
        const p of particles
    ) {

        const strength =
            3.5 +
            Math.random() *
            1.7;

        p.velocity.x +=
            strength;

        p.velocity.y +=
            THREE.MathUtils.randFloat(
                0.6,
                2
            );

    }

}


// ============================================================
// UI
// ============================================================

let paused = false;


const resetButton =
    document.getElementById(
        "reset"
    );

const pourButton =
    document.getElementById(
        "pour"
    );

const pauseButton =
    document.getElementById(
        "pause"
    );

const waveButton =
    document.getElementById(
        "wave"
    );


resetButton.onclick =
    () => resetParticles();


pourButton.onclick =
    () => pourFluid();


waveButton.onclick =
    () => makeWave();


pauseButton.onclick =
    () => {

        paused =
            !paused;

        pauseButton.textContent =
            paused
            ? "Resume"
            : "Pause";

        pauseButton.classList.toggle(
            "active",
            paused
        );

    };


function connectSlider(
    id,
    callback
) {

    const element =
        document.getElementById(
            id
        );

    element.addEventListener(
        "input",
        () => {

            callback(
                parseFloat(
                    element.value
                )
            );

        }
    );

}


connectSlider(
    "gravity",
    value =>
        CONFIG.gravity = value
);


connectSlider(
    "cohesion",
    value =>
        CONFIG.cohesion = value
);


connectSlider(
    "viscosity",
    value =>
        CONFIG.viscosity = value
);


connectSlider(
    "surface",
    value =>
        CONFIG.surfaceIsolation = value
);


connectSlider(
    "blobRadius",
    value =>
        CONFIG.blobRadius = value
);


// ============================================================
// FPS
// ============================================================

const statsElement =
    document.getElementById(
        "stats"
    );

let frames = 0;
let fps = 0;
let fpsTime =
    performance.now();


function updateFPS() {

    frames++;

    const now =
        performance.now();

    if (
        now - fpsTime >
        500
    ) {

        fps =
            Math.round(

                frames * 1000 /
                (
                    now -
                    fpsTime
                )

            );

        frames = 0;
        fpsTime = now;

        statsElement.textContent =
            `${fps} FPS · ${particles.length} particles · MC ${resolution}³`;

    }

}


// ============================================================
// ANIMATION
// ============================================================

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    let dt =
        Math.min(
            clock.getDelta(),
            1 / 30
        );


    if (!paused) {

        const subDt =
            dt /
            CONFIG.simulationSubsteps;


        for (
            let i = 0;
            i <
            CONFIG.simulationSubsteps;
            i++
        ) {

            simulateFluid(
                subDt
            );

        }


        updateFluidMesh();

        if (
            particleDebug.visible
        ) {

            updateDebugParticles();

        }

    }


    controls.update();

    renderer.render(
        scene,
        camera
    );

    updateFPS();

}


animate();


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


// ============================================================
// DEBUG KEY
// ============================================================

window.addEventListener(
    "keydown",
    event => {

        if (
            event.key.toLowerCase() ===
            "p"
        ) {

            particleDebug.visible =
                !particleDebug.visible;

        }

        if (
            event.key.toLowerCase() ===
            "r"
        ) {

            resetParticles();

        }

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            makeWave();

        }

    }
);

</script>
